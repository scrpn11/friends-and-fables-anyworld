name: Populate Wuthering Waves Character Metadata

on:
  push:
    paths:
      - '.github/workflows/populate-wuthering-waves-metadata.yml'

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Populate metadata for Carlotta and later characters
        shell: python
        run: |
          from pathlib import Path
          import re

          data = {
            'carlotta': {'aliases':'Opal','pronouns':'She/Her','alignment':'Lawful Neutral','stats':[8,16,12,15,13,16]},
            'cartethyia': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[10,15,12,13,15,16]},
            'changli': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Good','stats':[10,15,12,17,15,16]},
            'chisa': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Neutral','stats':[10,16,12,15,14,12]},
            'chixia': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Good','stats':[10,16,13,11,13,16]},
            'ciaccona': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Good','stats':[9,14,12,14,15,17]},
            'danjin': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Good','stats':[11,17,13,12,15,13]},
            'denia': {'aliases':'','pronouns':'She/Her','alignment':'True Neutral','stats':[8,13,11,16,16,15]},
            'encore': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Good','stats':[7,14,10,14,13,17]},
            'galbrena': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Neutral','stats':[12,16,14,13,14,12]},
            'hiyuki': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Neutral','stats':[11,16,13,15,14,12]},
            'iuno': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[10,15,12,14,16,15]},
            'jianxin': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Good','stats':[12,15,14,13,17,14]},
            'jinhsi': {'aliases':'Magistrate of Jinzhou','pronouns':'She/Her','alignment':'Lawful Good','stats':[9,14,12,16,16,17]},
            'jiyan': {'aliases':'General Jiyan','pronouns':'He/Him','alignment':'Lawful Good','stats':[16,15,15,14,16,15]},
            'lingyang': {'aliases':'','pronouns':'He/Him','alignment':'Neutral Good','stats':[13,17,14,11,14,15]},
            'lucilla': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Neutral','stats':[9,16,12,14,13,16]},
            'lucy': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[8,14,11,15,14,17]},
            'lumi': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[10,15,13,12,15,16]},
            'lupa': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Good','stats':[15,16,15,11,13,15]},
            'luuk-herssen': {'aliases':'','pronouns':'He/Him','alignment':'Lawful Neutral','stats':[11,14,13,17,15,14]},
            'lynae': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[9,15,12,15,14,16]},
            'mornye': {'aliases':'','pronouns':'She/Her','alignment':'True Neutral','stats':[10,13,14,16,15,13]},
            'mortefi': {'aliases':'','pronouns':'He/Him','alignment':'Lawful Neutral','stats':[9,14,12,18,14,12]},
            'phoebe': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Good','stats':[9,14,12,15,16,17]},
            'phrolova': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Evil','stats':[9,15,12,17,15,16]},
            'qiuyuan': {'aliases':'','pronouns':'He/Him','alignment':'Lawful Neutral','stats':[12,16,13,15,16,13]},
            'rebecca': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Neutral','stats':[9,15,12,14,13,16]},
            'roccia': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Good','stats':[8,16,11,13,14,16]},
            'rover': {'aliases':'','pronouns':'He/Him','alignment':'True Neutral','stats':[13,15,14,14,14,13]},
            'sanhua': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Neutral','stats':[11,17,13,14,16,11]},
            'shorekeeper': {'aliases':'The Shorekeeper','pronouns':'She/Her','alignment':'Lawful Good','stats':[8,13,12,17,17,16]},
            'sigrika': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[10,15,12,14,15,16]},
            'suisui': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Good','stats':[9,15,12,13,15,17]},
            'taoqi': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Good','stats':[14,11,17,13,15,14]},
            'verina': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[7,13,12,15,17,15]},
            'xiangli-yao': {'aliases':'','pronouns':'He/Him','alignment':'Lawful Good','stats':[10,14,12,18,16,14]},
            'yangyang': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[9,15,12,13,16,16]},
            'yinlin': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Good','stats':[9,17,12,15,16,16]},
            'youhu': {'aliases':'','pronouns':'She/Her','alignment':'Chaotic Good','stats':[8,15,11,14,15,17]},
            'yuanwu': {'aliases':'','pronouns':'He/Him','alignment':'Lawful Good','stats':[15,13,16,13,15,14]},
            'zani': {'aliases':'','pronouns':'She/Her','alignment':'Lawful Neutral','stats':[15,13,16,14,15,13]},
            'zhezhi': {'aliases':'','pronouns':'She/Her','alignment':'Neutral Good','stats':[8,14,11,16,15,15]},
          }

          root = Path('characters/wuthering-waves')
          changed=[]
          for slug, meta in data.items():
              path = root/slug/f'{slug}.md'
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              # preserve Name already present
              text = re.sub(r'^\*\*Aliases:\*\*.*$', f"**Aliases:** {meta['aliases']}  ", text, flags=re.M)
              text = re.sub(r'^\*\*Pronouns:\*\*.*$', f"**Pronouns:** {meta['pronouns']}  ", text, flags=re.M)
              text = re.sub(r'^\*\*Alignment:\*\*.*$', f"**Alignment:** {meta['alignment']}  ", text, flags=re.M)
              s,d,c,i,w,ch = meta['stats']
              replacements = {
                  'Level':'1','Speed':'30 feet','Hit Dice':'1d8','Hit Points':'10','Experience':'0',
                  'Strength':str(s),'Dexterity':str(d),'Constitution':str(c),'Intelligence':str(i),'Wisdom':str(w),'Charisma':str(ch)
              }
              for key,val in replacements.items():
                  text = re.sub(rf'^\*\*{re.escape(key)}:\*\*.*$', f'**{key}:** {val}  ', text, flags=re.M)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          Path('.tmp-wuthering-waves-metadata-report.txt').write_text('CHANGED\n'+'\n'.join(changed)+'\n', encoding='utf-8')
      - name: Commit populated character metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add characters/wuthering-waves .tmp-wuthering-waves-metadata-report.txt
          git commit -m "Populate Wuthering Waves aliases pronouns alignment and stats"
          git push
