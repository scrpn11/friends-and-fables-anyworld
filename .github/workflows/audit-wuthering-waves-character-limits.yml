name: Debug Wuthering Waves Character Limit Normalization

on:
  push:
    paths:
      - '.github/workflows/audit-wuthering-waves-character-limits.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate normalization and write debug report
        shell: python
        run: |
          from pathlib import Path
          import re

          limits = {
              'Brief Description': (250, 350),
              'Appearance': (900, 1000),
              'Backstory': (900, 1000),
              'Mannerisms': (200, 300),
              'Personality': (900, 1000),
          }
          aliases = {'Brief Description': ['Brief Description', 'Brief']}

          def find_section(text, heading):
              for name in aliases.get(heading, [heading]):
                  pattern = rf'(^#{{2,3}} {re.escape(name)}\s*\n\s*)(.*?)(?=\n\s*(?:\*\*Character Type:|#{{2,3}} ))'
                  m = re.search(pattern, text, re.M | re.S)
                  if m:
                      return m
              return None

          def trim_prose(prose, lo, hi):
              prose = prose.strip()
              if len(prose) <= hi:
                  return prose

              # Preserve the greatest possible amount of original prose by ending
              # at the latest natural punctuation boundary inside the allowed range.
              candidates = []
              for m in re.finditer(r'[.!?;:,](?=\s|$)', prose[:hi + 1]):
                  if m.end() >= lo:
                      candidates.append((m.end(), m.group()))
              if candidates:
                  end, punct = candidates[-1]
                  cut = prose[:end].rstrip()
                  if punct not in '.!?':
                      cut = cut.rstrip(' ,;:') + '.'
                  if len(cut) <= hi:
                      return cut

              # Last resort: keep a complete word and close the sentence cleanly.
              cut = prose[:hi - 1].rstrip()
              if hi - 1 < len(prose) and prose[hi - 1].strip() and cut and not cut[-1].isspace():
                  cut = re.sub(r'\s+\S*$', '', cut)
              cut = cut.rstrip(' ,;:.-') + '.'
              if len(cut) < lo:
                  cut = prose[:hi - 1].rstrip(' ,;:.-') + '.'
              if len(cut) > hi:
                  cut = cut[:hi - 1].rstrip(' ,;:.-') + '.'
              return cut

          root = Path('characters/wuthering-waves')
          lines = ['PROPOSED_CHANGES']
          errors = []
          for path in sorted(root.glob('*/*.md')):
              text = path.read_text(encoding='utf-8')
              file_changes = []
              for heading, (lo, hi) in limits.items():
                  m = find_section(text, heading)
                  if not m:
                      errors.append(f'{path.as_posix()} {heading}:MISSING')
                      continue
                  prose = m.group(2).strip()
                  before = len(prose)
                  if before > hi:
                      revised = trim_prose(prose, lo, hi)
                      after = len(revised)
                      file_changes.append(f'{heading}:{before}->{after}')
                      if not lo <= after <= hi:
                          errors.append(f'{path.as_posix()} {heading}:{before}->{after}')
                      text = text[:m.start(2)] + revised + text[m.end(2):]
              if file_changes:
                  lines.append(f'{path.as_posix()}\t' + ','.join(file_changes))

          lines += ['', 'ERRORS'] + (errors if errors else ['NONE'])
          Path('.tmp-wuthering-waves-debug.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Commit debug report only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-wuthering-waves-debug.txt
          git commit -m "Update temporary Wuthering Waves normalization debug report"
          git push
