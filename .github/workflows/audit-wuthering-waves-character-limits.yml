name: Normalize Wuthering Waves Character Limits

on:
  push:
    paths:
      - '.github/workflows/audit-wuthering-waves-character-limits.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize over-limit sections and audit final text
        shell: python
        run: |
          from pathlib import Path
          import re

          limits = {
              'Brief Description': (250, 350),
              'Appearance': (900, 1000),
              'Backstory': (900, 1000),
              'Mannerisms': (200, 300),
              'Personality': (900, 1000),
          }
          aliases = {'Brief Description': ['Brief Description', 'Brief']}

          def find_section(text, heading):
              names = aliases.get(heading, [heading])
              for name in names:
                  pattern = rf'(^#{{2,3}} {re.escape(name)}\s*\n\s*)(.*?)(?=\n\s*(?:\*\*Character Type:|#{{2,3}} ))'
                  m = re.search(pattern, text, re.M | re.S)
                  if m:
                      return m
              return None

          def trim_prose(prose, lo, hi):
              prose = prose.strip()
              if len(prose) <= hi:
                  return prose
              sentence_ends = [m.end() for m in re.finditer(r'[.!?](?=\s|$)', prose[:hi + 1]) if m.end() >= lo]
              if sentence_ends:
                  return prose[:sentence_ends[-1]].rstrip()
              clause_ends = [m.end() for m in re.finditer(r'[;:,](?=\s|$)', prose[:hi]) if m.end() >= lo]
              if clause_ends:
                  cut = prose[:clause_ends[-1]].rstrip(' ,;:')
                  return cut + '.'
              cut = prose[:hi - 1].rstrip()
              if len(cut) == hi - 1 and prose[hi - 1:hi].strip():
                  cut = re.sub(r'\s+\S*$', '', cut)
              if len(cut) < lo:
                  cut = prose[:hi - 1].rstrip()
              return cut.rstrip(' ,;:.-') + '.'

          changed = []
          root = Path('characters/wuthering-waves')
          for path in sorted(root.glob('*/*.md')):
              text = path.read_text(encoding='utf-8')
              original = text
              file_changes = []
              for heading, (lo, hi) in limits.items():
                  m = find_section(text, heading)
                  if not m:
                      continue
                  prose = m.group(2).strip()
                  before = len(prose)
                  if before > hi:
                      revised = trim_prose(prose, lo, hi)
                      after = len(revised)
                      if not lo <= after <= hi:
                          raise RuntimeError(f'{path}: {heading} normalized to invalid length {after}')
                      text = text[:m.start(2)] + revised + text[m.end(2):]
                      file_changes.append(f'{heading}:{before}->{after}')
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(f'{path.as_posix()}\t' + ','.join(file_changes))

          lines = ['CHANGED_FILES'] + changed + ['', 'FINAL_AUDIT']
          failing = 0
          for path in sorted(root.glob('*/*.md')):
              text = path.read_text(encoding='utf-8')
              counts = []
              violations = []
              for heading, (lo, hi) in limits.items():
                  m = find_section(text, heading)
                  if not m:
                      counts.append(f'{heading}=MISSING')
                      violations.append(f'{heading}:MISSING')
                      continue
                  prose = m.group(2).strip()
                  n = len(prose)
                  counts.append(f'{heading}={n}')
                  if not lo <= n <= hi:
                      violations.append(f'{heading}:{n}')
              status = 'FAIL' if violations else 'PASS'
              if violations:
                  failing += 1
              lines.append(f'{status}\t{path.as_posix()}\t' + '\t'.join(counts) + ('\tVIOLATIONS=' + ','.join(violations) if violations else ''))
          lines.append(f'TOTAL_FAILING_FILES={failing}')
          Path('.tmp-wuthering-waves-audit.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          if failing:
              raise RuntimeError(f'{failing} files remain outside template limits')
      - name: Commit normalized character sheets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add characters/wuthering-waves .tmp-wuthering-waves-audit.txt
          git commit -m "Normalize Wuthering Waves character section limits"
          git pull --rebase origin main
          git push
